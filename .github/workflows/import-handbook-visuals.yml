name: Import Handbook Visuals
on:
  push:
    branches: [inspire-v1.6-visual-handbook]
    paths:
      - ".github/workflows/import-handbook-visuals.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inspire-v1.6-visual-handbook
      - name: Download handbook visuals from source Google Doc
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/handbook/penampilan-diri
