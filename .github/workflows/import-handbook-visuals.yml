      - name: Commit downloaded assets
        shell: bash
        run: |
          git config user.name "inspire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/handbook/penampilan-diri
          git commit -m "Add handbook grooming visuals from source document"
