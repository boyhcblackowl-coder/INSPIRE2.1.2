name: Import V1.9 Home Assets
on:
  push:
    branches: [inspire-v1.9-home-experience]
    paths:
      - ".github/workflows/import-v19-home-assets.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inspire-v1.9-home-experience
      - name: Extract optimized home assets
        run: |
          set -euo pipefail
          mkdir -p assets/home
          unzip -o .github/tmp/inspire-v19-home-assets.zip -d /tmp/inspire-home
          cp /tmp/inspire-home/hero-tiny.jpg assets/home/hero-collage.jpg
          cp /tmp/inspire-home/halloween-tiny.jpg assets/home/carousel-halloween.jpg
          cp /tmp/inspire-home/boss-tiny.jpg assets/home/carousel-boss.jpg
          cp /tmp/inspire-home/team-tiny.jpg assets/home/carousel-team.jpg
          cp /tmp/inspire-home/bukber-tiny.jpg assets/home/carousel-bukber.jpg
          cp /tmp/inspire-home/crowd-tiny.jpg assets/home/carousel-crowd.jpg
          cp /tmp/inspire-home/stage-tiny.jpg assets/home/carousel-stage.jpg
          file assets/home/*
      - name: Commit assets
        run: |
          git config user.name "inspire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/home
          git commit -m "Import V1.9 home hero and carousel assets"
          git push origin HEAD:inspire-v1.9-home-experience
