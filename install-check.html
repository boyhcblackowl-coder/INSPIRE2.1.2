<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/INSPIRE2.1.2/manifest.json?v=3">
<link rel="icon" href="/INSPIRE2.1.2/icon-192.png?v=3">
<title>INSPIRE Install Check</title>
<style>
body{font-family:Arial;background:#0C0D0F;color:#fff;padding:20px}
.card{max-width:680px;margin:auto;background:#17191C;border-radius:18px;padding:20px}
.ok{color:#78df8e} .warn{color:#ffd26f} .bad{color:#ff8b8b}
.row{padding:9px 0;border-bottom:1px solid #333}
button{padding:12px 16px;border:0;border-radius:10px;background:#D7B97C;font-weight:800}
img{width:96px;height:96px;border-radius:18px}
</style>
</head>
<body>
<div class="card">
<img src="/INSPIRE2.1.2/icon-192.png?v=3">
<h1>INSPIRE Install Check</h1>
<div class="row">Site: <code>/INSPIRE2.1.2/</code></div>
<div id="checks"></div>
<p class="warn">After opening this page, tap anywhere once and keep it open for at least 30 seconds. Chrome may use engagement heuristics before offering install.</p>
<button id="installBtn" hidden>Install INSPIRE</button>
</div>

<script>
let deferredPrompt = null;
const lines = [];
function add(cls,txt){
  lines.push(`<div class="row ${cls}">${txt}</div>`);
  document.getElementById('checks').innerHTML = lines.join('');
}

(async()=>{
  for (const [label,url] of [
    ['Manifest','/INSPIRE2.1.2/manifest.json?v=3'],
    ['Icon 192','/INSPIRE2.1.2/icon-192.png?v=3'],
    ['Icon 512','/INSPIRE2.1.2/icon-512.png?v=3'],
    ['Maskable icon','/INSPIRE2.1.2/icon-maskable-512.png?v=3'],
    ['Service worker','/INSPIRE2.1.2/service-worker.js?v=3']
  ]) {
    try {
      const r = await fetch(url,{cache:'no-store'});
      add(r.ok?'ok':'bad',`${r.ok?'✅':'❌'} ${label} — HTTP ${r.status}`);
    } catch(e) {
      add('bad',`❌ ${label} — ${e.message}`);
    }
  }

  if ('serviceWorker' in navigator) {
    try {
      const reg = await navigator.serviceWorker.register('/INSPIRE2.1.2/service-worker.js?v=3', {
        scope:'/INSPIRE2.1.2/', updateViaCache:'none'
      });
      await reg.update();
      add('ok','✅ Service Worker registered: ' + reg.scope);

      if (navigator.serviceWorker.controller) {
        add('ok','✅ This page is controlled by a Service Worker');
      } else {
        add('warn','⚠️ Not controlled yet — refresh this page once');
      }
    } catch(e) {
      add('bad','❌ Service Worker registration: ' + e.message);
    }
  }
})();

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  add('ok','✅ beforeinstallprompt fired — Chrome considers INSPIRE installable');
  document.getElementById('installBtn').hidden = false;
});

document.getElementById('installBtn').onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBtn').hidden = true;
};

setTimeout(() => {
  if (!deferredPrompt) {
    add('warn','⚠️ beforeinstallprompt has not fired yet. Tap the page and keep it open for ≥30 seconds, then revisit/refresh once.');
  }
}, 35000);
</script>
</body>
</html>
